# Nginx Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment

spec:
  # HPA가 Pod 개수를 관리
  # replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: nginx-web-label

  # 아래부터 Pod 설정
  template:
    metadata:
      labels:
        app: nginx-web-label

    spec:
      containers:
        - name: nginx-container
          image: minmin88/std01-nginx:c046b704c61dcaa3bf03157dbe90d65c4e98ca7e

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          env:
            - name: NGINX_PORT
              value: "80"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
# HPA(Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---
# Nginx Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-service

spec:
  # 외부 직접 접속은 막고 ALB를 통해 접근
  type: ClusterIP

  selector:
    app: nginx-web-label

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ALB Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-base-ingress

  annotations:
    # 외부에서 접속 가능한 ALB
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ALB가 Pod IP로 직접 트래픽 전달
    alb.ingress.kubernetes.io/target-type: ip

    # HTTP 80 / HTTPS 443 사용
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # ACM 인증서
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:925047940866:certificate/02a00df3-af02-463d-88b5-ebc60bd3003f

    # HTTP 접속 시 HTTPS로 리다이렉트
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # /nginx 요청을 Nginx 내부의 / 경로로 재작성
    alb.ingress.kubernetes.io/transforms.nginx-service: >
      [
        {
          "type": "url-rewrite",
          "urlRewriteConfig": {
            "rewrites": [
              {
                "regex": "^\\/nginx(?:\\/(.*))?$",
                "replace": "/$1"
              }
            ]
          }
        }
      ]

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80