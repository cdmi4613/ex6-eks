# 워크플로우 이름
name: GitOps ArgoCD CI/CD Pipeline

# main 브랜치에 Push가 발생하면 워크플로우 실행
on:
  push:
    branches:
      - main

# 실행할 Job 정의
jobs:
  build-and-update:
    # GitHub Actions에서 Ubuntu 가상 서버를 생성하여 아래 작업들을 실행
    runs-on: ubuntu-latest

    permissions:
      # GitHub Actions가 현재 저장소의 파일을 수정하고
      # commit / push 할 수 있도록 쓰기 권한을 부여
      # 이후 deployment.yaml의 Docker 이미지 태그를 변경한 뒤
      # 수정된 YAML을 다시 GitHub에 Push하기 위해 필요
      contents: write

    steps:
      # GitHub 저장소의 소스코드를 Actions의 Ubuntu 서버로 가져옴
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # GitHub Secrets에 저장해둔 Docker Hub 계정으로 로그인
      # 이후 Docker 이미지를 Docker Hub에 Push하기 위해 필요
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Dockerfile을 이용하여 이미지를 Build하고
      # 이후 Docker Registry에 Push하기 위한 단계
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile # Dockerfile의 경로 및 파일명
          push: true
          tags: minmin88/std01-nginx:${{ github.sha }} # (중요) 이미지명 정의 (태그 자동생성)

      - name: 쿠버네티스 파일의 이미지 태그 갱신 및 Git push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          sed -i "s|image: minmin88/std01-nginx.*|image: minmin88/std01-nginx:${{ github.sha }}|g" ./k8s/nginx-deployment.yaml

          git add ./k8s/nginx-deployment.yaml
          git commit -m "Update nginx image tag to ${{ github.sha }}"
          git push